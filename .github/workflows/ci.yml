name: CI

on:
  push:
    branches: [main, "Release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Migrations match schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name ci-drift-check
          git diff --exit-code --stat -- drizzle || (echo "Schema changed without a migration. Run: npm run db:generate" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (git status --porcelain -- drizzle && echo "Schema changed without a migration. Run: npm run db:generate" && exit 1)
      - run: npm run build

  import-script:
    name: Python import script compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 python -m py_compile scripts/import_medmcqa.py
